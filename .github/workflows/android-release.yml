name: Android release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - name: Test release versioning
        run: python3 -m unittest discover -s tool -p 'test_*.py'

  release:
    name: Build APK and publish release
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Bump APK version for this push
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: python3 tool/release_version.py --run-number "$RUN_NUMBER" --github-output "$GITHUB_OUTPUT"
      - name: Restore stable Android signing key
        env:
          ANDROID_DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          encoded = os.environ.get('ANDROID_DEBUG_KEYSTORE', '').strip()
          if not encoded:
              raise SystemExit('Set the ANDROID_DEBUG_KEYSTORE repository secret before building a release.')
          key = Path(os.environ['RUNNER_TEMP']) / 'baby-log-signing' / 'debug.keystore'
          key.parent.mkdir(parents=True, exist_ok=True)
          key.write_bytes(base64.b64decode(encoded, validate=True))
          key.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'ANDROID_KEYSTORE_PATH={key}\n')
          PY
      - run: flutter pub get
      - name: Build release APK
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.workers.max=2
        run: |
          chmod +x android/gradlew
          flutter build apk --release --no-pub
      - name: Verify APK uses the existing signing certificate
        run: python3 tool/verify_apk_signing.py
      - name: Prepare APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: cp build/app/outputs/flutter-apk/app-release.apk "BabyLog-${VERSION}.apk"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: BabyLog-${{ steps.version.outputs.version }}
          path: BabyLog-*.apk
          if-no-files-found: error
          overwrite: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
        run: |
          APK="BabyLog-${VERSION}.apk"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
            gh release upload "$RELEASE_TAG" "$APK" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK" --target "$GITHUB_SHA" \
              --title "Baby Log ${VERSION}" --generate-notes \
              --notes "Android version ${VERSION}, build ${BUILD_NUMBER}. Tests passed before building."
          fi
