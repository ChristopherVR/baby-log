name: Android and Windows release

on:
  push:
    branches: [main]

# Coalesce quick pushes: only the newest main revision should reach release.
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - name: Test release tooling
        run: python3 -m unittest discover -s tool -p 'test_*.py'

  prepare:
    name: Prepare shared version and release notes
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Set version for both platforms for this push
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: python3 tool/release_version.py --run-number "$RUN_NUMBER" --github-output "$GITHUB_OUTPUT"
      - name: Install git-cliff
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: git-cliff@2.14.2
      - name: Generate and bundle release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Ignore drafts, including an interrupted publication. Reruns use the
          # previous release so their notes do not become empty after publishing.
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          python3 tool/release_notes.py --version "$VERSION" --releases-json "$RUNNER_TEMP/releases.json"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-metadata
          path: |
            pubspec.yaml
            assets/release_notes.json
            RELEASE_NOTES.md
          if-no-files-found: error
          overwrite: true

  android:
    name: Build Android APK
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-metadata
      - name: Restore stable Android signing key
        env:
          ANDROID_DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          encoded = os.environ.get('ANDROID_DEBUG_KEYSTORE', '').strip()
          if not encoded:
              raise SystemExit('Set the ANDROID_DEBUG_KEYSTORE repository secret before building a release.')
          key = Path(os.environ['RUNNER_TEMP']) / 'baby-log-signing' / 'debug.keystore'
          key.parent.mkdir(parents=True, exist_ok=True)
          key.write_bytes(base64.b64decode(encoded, validate=True))
          key.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'ANDROID_KEYSTORE_PATH={key}\n')
          PY
      - run: flutter pub get
      - name: Build release APK
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.workers.max=2
        run: |
          chmod +x android/gradlew
          flutter build apk --release --no-pub
      - name: Verify APK uses the existing signing certificate
        run: python3 tool/verify_apk_signing.py
      - name: Prepare APK
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: cp build/app/outputs/flutter-apk/app-release.apk "BabyLog-${VERSION}.apk"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: android-release
          path: BabyLog-*.apk
          if-no-files-found: error
          overwrite: true

  windows:
    name: Build Windows ZIP and test syncing
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-metadata
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter test --no-pub
      - run: flutter build windows --release --no-pub
      - name: Package the complete Windows application
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $bundle = 'build/windows/x64/runner/Release'
          foreach ($file in @('baby_app.exe', 'flutter_windows.dll', 'data/app.so', 'data/icudtl.dat', 'vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll')) {
            if (-not (Test-Path "$bundle/$file")) { throw "Missing Windows runtime file: $file" }
          }
          Copy-Item windows/RELEASE_README.txt "$bundle/README.txt"
          Compress-Archive -Path "$bundle/*" -DestinationPath "BabyLog-$env:VERSION-windows-x64.zip"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-release
          path: BabyLog-*-windows-x64.zip
          if-no-files-found: error
          overwrite: true

  release:
    name: Publish Android and Windows release
    needs: [prepare, android, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: '*-release'
          merge-multiple: true
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-metadata
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # Also reject manual reruns of an older revision.
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          APK="BabyLog-${VERSION}.apk"
          WINDOWS="BabyLog-${VERSION}-windows-x64.zip"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
            gh release upload "$RELEASE_TAG" "$APK" "$WINDOWS" --clobber
            gh release edit "$RELEASE_TAG" --notes-file RELEASE_NOTES.md
          else
            gh release create "$RELEASE_TAG" "$APK" "$WINDOWS" --target "$GITHUB_SHA" \
              --title "Baby Log ${VERSION}" --notes-file RELEASE_NOTES.md
          fi
