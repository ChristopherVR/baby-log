name: Android release

on:
  push:
    branches: [main]

# Coalesce quick pushes: only the newest main revision should reach release.
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - name: Test release tooling
        run: python3 -m unittest discover -s tool -p 'test_*.py'

  release:
    name: Build APK and publish release
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Bump APK version for this push
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: python3 tool/release_version.py --run-number "$RUN_NUMBER" --github-output "$GITHUB_OUTPUT"
      - name: Install git-cliff
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: git-cliff@2.14.2
      - name: Generate and bundle release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Ignore drafts, including an interrupted publication. Reruns use the
          # previous release so their notes do not become empty after publishing.
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          python3 tool/release_notes.py --version "$VERSION" --releases-json "$RUNNER_TEMP/releases.json"
      - name: Restore stable Android signing key
        env:
          ANDROID_DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          encoded = os.environ.get('ANDROID_DEBUG_KEYSTORE', '').strip()
          if not encoded:
              raise SystemExit('Set the ANDROID_DEBUG_KEYSTORE repository secret before building a release.')
          key = Path(os.environ['RUNNER_TEMP']) / 'baby-log-signing' / 'debug.keystore'
          key.parent.mkdir(parents=True, exist_ok=True)
          key.write_bytes(base64.b64decode(encoded, validate=True))
          key.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'ANDROID_KEYSTORE_PATH={key}\n')
          PY
      - run: flutter pub get
      - name: Build release APK
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.workers.max=2
        run: |
          chmod +x android/gradlew
          flutter build apk --release --no-pub
      - name: Verify APK uses the existing signing certificate
        run: python3 tool/verify_apk_signing.py
      - name: Prepare APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: cp build/app/outputs/flutter-apk/app-release.apk "BabyLog-${VERSION}.apk"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: BabyLog-${{ steps.version.outputs.version }}
          path: BabyLog-*.apk
          if-no-files-found: error
          overwrite: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Also reject manual reruns of an older revision.
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          APK="BabyLog-${VERSION}.apk"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
            gh release upload "$RELEASE_TAG" "$APK" --clobber
            gh release edit "$RELEASE_TAG" --notes-file RELEASE_NOTES.md
          else
            gh release create "$RELEASE_TAG" "$APK" --target "$GITHUB_SHA" \
              --title "Baby Log ${VERSION}" --notes-file RELEASE_NOTES.md
          fi
